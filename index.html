<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коли виходити</title>
<meta name="description" content="Підказує, о котрій вийти з дому, щоб встигнути на пару">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f7fa;--card:#fff;--text:#0f1720;--muted:#5b6876;--line:#dde4eb;--accent:#0b7bb5;--accent-ink:#fff;--ok:#18794e;--warn:#a15c00;--bad:#b42318;--radius:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--card:#18222e;--text:#e8eef4;--muted:#93a1b0;--line:#27333f;--accent:#38bdf8;--accent-ink:#06202e;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}
h1{font-size:1.25rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:end}.row>*{flex:1}.row>button{flex:0 0 auto}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.name{font-size:.9rem;color:var(--ok);margin:4px 0 0;min-height:1.3em}
.name.err{color:var(--bad)}
.big{font-size:3rem;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:4px 0}
.count{font-size:1.1rem;color:var(--muted)}
.count b{color:var(--text)}
.badge{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.badge.gps{color:var(--ok)}.badge.schedule{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
ul{list-style:none;margin:0;padding:0}
li.opt{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
li.opt:first-child{border-top:0}
.empty{color:var(--muted)}
.error{color:var(--bad)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
.status{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.big{transition:color .2s}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Коли виходити</h1>
    <button class="ghost" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">Налаштування</button>
  </header>

  <section class="card" id="settings" hidden aria-label="Налаштування">
    <label for="origin">Зупинка біля дому (id)</label>
    <input id="origin" inputmode="numeric" autocomplete="off" placeholder="наприклад 192">
    <p class="name" id="originName" aria-live="polite"></p>
    <label for="dest">Зупинка біля університету (id)</label>
    <input id="dest" inputmode="numeric" autocomplete="off" placeholder="наприклад 262">
    <p class="name" id="destName" aria-live="polite"></p>
    <p class="hint">Id — число в адресі сторінки зупинки: на eway.in.ua відкрий зупинку, адреса матиме вигляд …/lutsk/stops/<b>192</b>.</p>
    <details>
      <summary>Час пішки</summary>
      <label for="walkTo">До своєї зупинки, хв</label>
      <input id="walkTo" inputmode="decimal" value="5">
      <label for="walkFrom">Від кінцевої до аудиторії, хв</label>
      <input id="walkFrom" inputmode="decimal" value="3">
      <label for="safety">Мінімальний запас до пари, хв</label>
      <input id="safety" inputmode="decimal" value="5">
    </details>
    <div class="row" style="margin-top:16px"><button id="save" type="button">Зберегти</button></div>
    <p class="hint">Усе зберігається лише в цьому телефоні. Акаунтів і паролів немає.</p>
  </section>

  <section class="card" id="main" hidden>
    <label for="when" style="margin-top:0">Пара починається о</label>
    <div class="row">
      <input id="when" type="time" required>
      <button id="go" type="button">Порахувати</button>
    </div>
  </section>

  <section class="card" id="result" aria-live="polite" hidden></section>
  <p class="status" id="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
